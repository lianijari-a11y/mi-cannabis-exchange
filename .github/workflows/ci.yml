name: CI

# Runs on every push and pull request against main — typecheck, lint, the
# real Prisma-backed test suite, and a production build. Previously none
# of this ran automatically; a regression only surfaced if someone
# happened to run these by hand before shipping.
#
# The test suite (npm test) hits a real Postgres database directly — these
# are genuine integration tests (concurrency, money math), not mocked. To
# do that here WITHOUT ever touching the real production database, this
# job spins up its own throwaway Postgres service container, runs every
# migration against it fresh (prisma migrate deploy), then points the app
# at that instead of Supabase. The container and everything in it are
# destroyed when the job ends — nothing here can read, write, or affect
# real production data, and no production connection string is used or
# needed anywhere in this file. Every test in this repo creates and tears
# down its own fixtures (see e.g. customers.test.ts's afterEach) rather
# than depending on pre-seeded data, which is exactly what makes running
# against a completely empty, freshly-migrated database work correctly.
#
# No repo secrets are required for this workflow — DATABASE_URL/DIRECT_URL
# below point at the local service container, not anything real.
# NEXTAUTH_SECRET is a CI-only placeholder (the build step needs *some*
# value at module-load time, but doesn't authenticate anyone) — never the
# real production secret.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the throwaway CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking on purpose: this codebase has never had `npm run lint`
# enforced (every "Verified" note in CLAUDE.md's whole history cites
# tsc/test/build, never lint), so it's accumulated real pre-existing
# violations across many files unrelated to any specific change.
# Failing CI on all of that now would block every future push until
# someone does a dedicated cleanup pass. Left running (not removed)
# so the count/detail stays visible in the log for whenever that
# pass happens.
- name: Lint
  run: npm run lint
  continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
