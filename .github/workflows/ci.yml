name: CI

# Runs on every push and pull request against main — typecheck, lint, the
# real Prisma-backed test suite, and a production build. Previously none
# of this ran automatically; a regression only surfaced if someone
# happened to run these by hand before shipping.
#
# The test suite (npm test) hits the real dev Postgres database directly —
# these are genuine integration tests (concurrency, money math), not
# mocked. That's true whether they run here or on a laptop; running them
# in CI just means it now also happens on every push, not only when
# someone remembers to. Each test cleans up its own rows (see e.g.
# customers.test.ts's afterAll), same discipline this project already
# uses for every one-off manual verification.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL  — same pooled Supabase connection string used in .env
#   DIRECT_URL    — same direct Supabase connection string used in .env
# NEXTAUTH_SECRET below is a CI-only placeholder (the build step needs
# *some* value at module-load time, but doesn't authenticate anyone) —
# never the real production secret.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
